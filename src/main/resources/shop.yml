      slot: [4, 1]
    confirm:
      slot: [2, 3]
      material: LIME_WOOL
      name: "<green>ᴄᴏɴꜰɪʀᴍ ᴘᴜʀᴄʜᴀsᴇ"
      lore:
        - "<gray>%amount%x %item%"
        - "<gray>ᴛᴏᴛᴀʟ: <#FFD700>%total%"

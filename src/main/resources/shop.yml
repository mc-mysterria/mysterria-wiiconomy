      material: GOLD_INGOT
      name: "<#FFD700>ʙᴀʟᴀɴᴄᴇ"
      lore:
        - "<gray>%balance%"
    market-index:
      slot: [4, 5]
      material: PAPER
      name: "<aqua>ᴍᴀʀᴋᴇᴛ ɪɴᴅᴇx"
      lore:
        - "<gray>ᴄᴜʀʀᴇɴᴛ: <white>%market-index%"
        - "<dark_gray>ᴘʀɪᴄᴇs ꜰʟᴜᴄᴛᴜᴀᴛᴇ ᴡɪᴛʜ"
        - "<dark_gray>ᴛʜᴇ sᴇʀᴠᴇʀ'ѕ ᴛᴏᴛᴀʟ ᴡᴇᴀʟᴛʜ"
    search:
      slot: [8, 0]
      material: COMPASS
      name: "<white>sᴇᴀʀᴄʜ"
      lore:
        - "<gray>ᴄʟɪᴄᴋ ᴛᴏ sᴇᴀʀᴄʜ ʙʏ ɴᴀᴍᴇ"
  categories:
    wood:
      slot: [1, 2]
      material: OAK_LOG
      name: "<#B57A42>ᴡᴏᴏᴅ"
      lore:
        - "<gray>ᴘʟᴀɴᴋs, ʟᴏɢs,"
        - "<gray>ᴅᴏᴏʀs & ᴍᴏʀᴇ"
    stone:
      slot: [2, 2]
      material: STONE
      name: "<gray>sᴛᴏɴᴇ"
      lore:
        - "<gray>ʙʀɪᴄᴋs, ᴡᴀʟʟs,"
        - "<gray>sᴛᴀɪʀs & ᴍᴏʀᴇ"
    color:
      slot: [3, 2]
      material: WHITE_CONCRETE
      name: "<white>ᴄᴏʟᴏʀ"
      lore:
        - "<gray>ᴡᴏᴏʟ, ᴄᴏɴᴄʀᴇᴛᴇ,"
        - "<gray>sᴛᴀɪɴᴇᴅ ɢʟᴀss & ᴍᴏʀᴇ"
    nature:
      slot: [4, 2]
      material: GRASS_BLOCK
      name: "<green>ɴᴀᴛᴜʀᴇ"
      lore:
        - "<gray>ᴅɪʀᴛ, sᴀɴᴅ,"
        - "<gray>ʟᴇᴀᴠᴇs & ᴍᴏʀᴇ"
    nether_end:
      slot: [5, 2]
      material: NETHERRACK
      name: "<red>ɴᴇᴛʜᴇʀ & ᴇɴᴅ"
      lore:
        - "<gray>ɴᴇᴛʜᴇʀʀᴀᴄᴋ, ʙᴀsᴀʟᴛ,"
        - "<gray>ᴇɴᴅ sᴛᴏɴᴇ & ᴍᴏʀᴇ"
    decoration:
      slot: [6, 2]
      material: LANTERN
      name: "<yellow>ᴅᴇᴄᴏʀᴀᴛɪᴏɴ"
      lore:
        - "<gray>ʟᴀɴᴛᴇʀɴs, ɢʟᴀss,"
        - "<gray>ᴄʜᴀɪɴs & ᴍᴏʀᴇ"

# -----------------------------
#      W I I C   S H O P
# -----------------------------
# Auto-catalogued building-block market (/shop).
# The item list is generated automatically from the Bukkit Material registry —
# you do not maintain an item list here. Use the lists below only to fine-tune
# what the automatic catalogue picked up, and run `/wiic shop-audit` after any
# change to inspect the generated result (written to plugins/WIIC/shop-audit.txt).
# All prices are in coppets (the base currency; 64 coppets = 1 lick, 64 licks = 1 verldor).

catalog:
  # Exact material names to force-exclude, on top of the built-in ore/valuable/
  # functional-block filter. Use this for anything the automatic filter missed.
  deny: []

  # Exact material names to force-include even if the built-in filter, a
  # regex below, or the deny list above would otherwise exclude them.
  allow: []

  # Extra regex patterns (matched against the material name) to exclude.
  exclude-name-patterns:
    - "^INFESTED_.*"

pricing:
  # Base unit price (in coppets) for any material that doesn't match a
  # category price or an explicit override below.
  default-price: 4

  # Base unit price per catalogue category. See category-gui.categories
  # below for the full category list.
  category-prices:
    WOOD: 3
    STONE: 2
    COLOR: 5
    NATURE: 2
    NETHER_END: 6
    DECORATION: 8
    MISC: 4

  # Exact per-material overrides. Takes priority over everything below, including
  # shape-multipliers — an override is the final, absolute unit price.
  # overrides:
  #   OAK_PLANKS: 2
  overrides: { }

  # Multiplies category-prices/default-price by the material's "shape", so a raw
  # block that crafts into several processed units isn't priced the same as one of
  # those units — otherwise there's no reason to ever buy the processed form instead
  # of the raw one (e.g. a log costs the same as a plank today, but 1 log = 4 planks).
  # Matched by material-name suffix, longest match wins; anything unmatched is 1.0
  # (the base/processed tier — planks, the plain stone block, etc.).
  # Ratios below are exact vanilla crafting yields: 1 log -> 4 planks, 1 block -> 2
  # slabs, 6 material -> 4 stairs.
  shape-multipliers:
    _LOG: 4.0
    _WOOD: 4.0
    _STEM: 4.0
    _HYPHAE: 4.0
    _SLAB: 0.5
    _STAIRS: 1.5

market:
  # How often (in minutes) the server-wide money supply is rescanned, fully async.
  scan-interval-minutes: 10
  # vault-scan: sum every known account's balance via Vault2's getUUIDNameMap().
  # online-sample: sum only currently-online players' balances (cheaper, less accurate).
  supply-source: vault-scan
  # Reference money supply the index is measured against. 0 = auto-capture from
  # the first successful scan after install, then persisted to market-state.yml.
  baseline: 0
  # How strongly the index reacts to supply moving away from the baseline.
  # index = (supply / baseline) ^ elasticity, before smoothing and clamping.
  elasticity: 0.75
  # Exponential-moving-average weight given to each new scan (0-1). Lower = smoother.
  smoothing-alpha: 0.25
  min-multiplier: 0.5
  max-multiplier: 4.0

limits:
  # Hard cap on how many blocks can be bought in a single purchase (54 stacks).
  max-per-purchase: 3456
  # Minimum time between two purchases by the same player, in milliseconds.
  cooldown-ms: 500
  # The final confirm button in PurchaseConfirmGUI ignores clicks until this many
  # milliseconds have passed since the screen opened, so a click carried over
  # from the previous screen can't land on it.
  confirm-arm-ms: 400

# -------------------------------------------------------------------------
# GUI screens — standard item config keys apply: slot [col,row], material,
# name, lore, item-model, custom-model-data. All text is MiniMessage.
# -------------------------------------------------------------------------


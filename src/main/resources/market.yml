  items:
    listing:
      # %seller% never resolves to a name — see `listing-seller-anonymous` under
      # messages. Trades are anonymous by design: a buyer and seller who can read
      # each other's names off the shelf can meet outside and skip the sale tax.
      lore:
        - ""
        - "<gold>%price%"
        - "<dark_gray>ᴇxᴘɪʀᴇs ɪɴ %expires%"


  title: "ɪɴsᴘᴇᴄᴛ ᴏꜰꜰᴇʀ"
  background: GRAY_STAINED_GLASS_PANE

broker-gui:
  title: "ᴛʜᴇ ꜰᴇɴᴄᴇ"
  background: GRAY_STAINED_GLASS_PANE

price-gui:
  title: "ɴᴀᴍᴇ ʏᴏᴜʀ ᴘʀɪᴄᴇ"
  background: GRAY_STAINED_GLASS_PANE

my-listings-gui:
  title: "ʏᴏᴜʀ ʟɪsᴛɪɴɢs"
  background: GRAY_STAINED_GLASS_PANE

stash-gui:
  title: "ʏᴏᴜʀ sᴛᴀsʜ"
  background: GRAY_STAINED_GLASS_PANE

ledger-gui:
  title: "ᴛʜᴇ ʟᴇᴅɢᴇʀ"
  background: GRAY_STAINED_GLASS_PANE

banker-gui:
  title: "ᴛʜᴇ ʟᴇᴅɢᴇʀ ᴋᴇᴇᴘᴇʀ"
  background: GRAY_STAINED_GLASS_PANE

informant-gui:
  title: "ᴛʜᴇ ɪɴꜰᴏʀᴍᴀɴᴛ"
  background: GRAY_STAINED_GLASS_PANE
  items:
    # One per pathway with live goods; %pathway%
    pathway:
      material: ENCHANTED_BOOK
      name: "<dark_purple>%pathway%"
    # Ingredients have no pathway, so they get their own shelf; %count%
    ingredients:
      material: GLOW_BERRIES
      name: "<dark_purple>ɪɴɢʀᴇᴅɪᴇɴᴛs <dark_gray>(%count%)"
      lore:
        - ""
        - "<gray>ᴄᴏᴍᴘᴏɴᴇɴᴛs ᴡɪᴛʜ ɴᴏ ᴘᴀᴛʜᴡᴀʏ"
        - "<gray>ᴏꜰ ᴛʜᴇɪʀ ᴏᴡɴ."
    nothing:
      material: GLASS_BOTTLE
      name: "<gray>\"ɴᴏᴛʜɪɴɢ ᴍʏsᴛɪᴄᴀʟ ᴏɴ ᴛʜᴇ sʜᴇʟᴠᴇs ᴛᴏᴅᴀʏ...\""

courier-gui:
  title: "ᴛʜᴇ ᴄᴏᴜʀɪᴇʀ ᴘᴏsᴛ"
  background: GRAY_STAINED_GLASS_PANE
  # Lore of the escrowed horn; %tier% %seconds% %fee%
  lore:
    contract:
      - ""
      - "<green>ᴏɴ ᴅᴜᴛʏ"
      - "<gray>ᴛɪᴇʀ: <white>%tier%"
      - "<gray>ᴅᴇʟɪᴠᴇʀʏ: <white>%seconds%s"
      - ""
      - "<dark_gray>ᴘᴜʀᴄʜᴀsᴇs ꜰʟʏ sᴛʀᴀɪɢʜᴛ ᴛᴏ ʏᴏᴜ"

plot-gui:
  title: "sᴛᴀʟʟs ᴛᴏ ʟᴇᴛ"
  rent-title: "ᴛᴀᴋᴇ ᴛʜᴇ sᴛᴀʟʟ?"
  manage-title: "ʏᴏᴜʀ sᴛᴀʟʟ"
  background: GRAY_STAINED_GLASS_PANE
  # Plot icon lore per status; %plot% %price% %period% %renter% %expires%
  lore:
    available:
      - ""
      - "<green>ᴀᴠᴀɪʟᴀʙʟᴇ"
      - "<gray>%price% <dark_gray>/ %period%"
      - ""
      - "<dark_gray>ᴄʟɪᴄᴋ ᴛᴏ ʀᴇɴᴛ"
    yours:
      - ""
      - "<gold>ʏᴏᴜʀ sᴛᴀʟʟ"
      - "<gray>ᴘᴀɪᴅ ꜰᴏʀ %expires%"
      - ""
      - "<dark_gray>ᴄʟɪᴄᴋ ᴛᴏ ᴍᴀɴᴀɢᴇ"
    taken:
      - ""
      - "<red>ᴛᴀᴋᴇɴ"
      - "<gray>ʀᴇɴᴛᴇᴅ ʙʏ <white>%renter%"

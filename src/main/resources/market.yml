# ---------------------------------------------------------------------------
# Underground Beyonder Market
# ---------------------------------------------------------------------------
# The market lives in its own admin-built world (loaded by the Worlds plugin).
# Ships disabled: build the world, set `world` and `arrival`, place NPCs with
# /wiicmarket npc create <role>, register the hub entrance and exit door, then
# flip `enabled` and restart (or /wiicmarket reload for tuning-only changes).
enabled: false
world: "mysterria_market"
# x, y, z, yaw of the spot players arrive at inside the market world
arrival: [ 0.5, 64.0, 0.5, 0.0 ]

# Loads the market world at startup when no world manager has already done it.
# A world manager that forgets its registration between restarts leaves the level
# folder on disk but never loads it, and every entrance then refuses to teleport;
# with this on, WIIC loads the folder itself and the market comes back untouched.
# It is a load, not a generate — an existing folder keeps its builds and NPCs.
world-bootstrap:
  enabled: false
  # Level folder under the server root. Only used when Worlds is NOT installed and
  # WIIC loads the level through Bukkit itself — with Worlds present, `world` above
  # is the level key. Blank = `world` with any namespace stripped, because a folder
  # cannot be named "worlds:agora".
  folder: ""
  # Chunk generator, as given to /world create ... generator <name>. Blank generates
  # a flat void level. Only consulted when the world has to be created from nothing:
  # a level Worlds already knows keeps the generator it was registered with, and an
  # existing level folder keeps its own settings either way.
  generator: ""

confirm-arm-ms: 400

listings:
  daily-limit: 5                # listings per player per day
  max-active-per-player: 15
  listing-fee-percent: 2.0      # of asking price; money sink
  listing-fee-min: 1
  sale-tax-percent: 8.0         # taken from proceeds; money sink
  duration-hours: 72            # then the item returns to the seller's stash
  min-price: 1
  max-price: 1000000            # coppets (1 verldor = 4096 coppets)
  deny:
    materials:
      - "regex:.*SHULKER_BOX"
      - BUNDLE
      - BEDROCK
    pdc-keys: [ ]               # e.g. "circleofimagination:soulbound"
    allow-containers: false

sweeper:
  interval-seconds: 300
  reservation-timeout-seconds: 60
  transaction-retention-days: 90

# Browse categories — first match wins; CoI-tagged items always land in the
# implicit "beyonder" category regardless of these rules.
categories:
  weapons:
    icon: IRON_SWORD
    materials:
      - "regex:.*_SWORD"
      - "regex:.*_AXE"
      - BOW
      - CROSSBOW
      - TRIDENT
      - MACE
  tools:
    icon: IRON_PICKAXE
    materials:
      - "regex:.*_PICKAXE"
      - "regex:.*_SHOVEL"
      - "regex:.*_HOE"
      - FISHING_ROD
      - SHEARS
      - FLINT_AND_STEEL
  armor:
    icon: IRON_CHESTPLATE
    materials:
      - "regex:.*_HELMET"
      - "regex:.*_CHESTPLATE"
      - "regex:.*_LEGGINGS"
      - "regex:.*_BOOTS"
      - SHIELD
      - ELYTRA
  consumables:
    icon: POTION
    materials:
      - "regex:.*POTION.*"
      - GOLDEN_APPLE
      - ENCHANTED_GOLDEN_APPLE
      - "regex:.*_BUCKET"
  blocks:
    icon: BRICKS
    fallback-if-block: true
  misc:
    icon: STRING
    fallback: true

# ---------------------------------------------------------------------------
# Valuation - what the Fence offers when you put goods on his counter
# ---------------------------------------------------------------------------
# Only ever the price the screen OPENS on; the seller can move it anywhere
# between listings.min-price and listings.max-price.
#
# Beyonder goods are priced off the sequence they serve, exponentially: each step
# from 9 towards 0 multiplies the worth by `sequence-ratio`. At the defaults a
# Sequence 9 potion is 256 coppets (4 licks) and a Sequence 0 one is ~310k
# coppets (~75 verldors) - coppets against verldors, as intended.
#
# Ingredients carry no sequence in their PDC, so the sequence they serve comes
# from coi-ingredients.yml (the deepest formula that consumes them) and they are
# priced as a fraction of that formula's potion.
valuation:
  enabled: true
  coi:
    sequence-9-potion: 256      # coppets; the anchor the whole curve hangs off
    sequence-ratio: 2.2         # worth multiplier per step deeper into a pathway
    unknown-ingredient-sequence: 9   # for ingredients missing from coi-ingredients.yml
    kind:
      potion: 1.0               # the advancement itself - defines the scale
      characteristic: 2.5       # the half of a formula you cannot farm
      formula: 0.4              # knowledge of a recipe, not the recipe's contents
      imbued: 1.2               # imbued armour
      ingredient-main: 0.12     # a formula's defining component
      ingredient-supplementary: 0.05
      other: 0.5                # CoI-tagged but an unrecognised family
      # Artifacts have a seal level (0 Sealed .. 3 Normal) rather than a sequence,
      # so their multiplier carries the whole spread on its own.
      artifact-sealed: 1200.0         # ~75 verldors: a Sequence 0 potion's peer
      artifact-mystical: 300.0
      artifact-extraordinary: 60.0
      artifact-normal: 12.0
  # What the market has actually been paying beats any formula. Once this many
  # sales of the same kind of goods exist, their median is blended in at `weight`.
  history:
    sample-size: 9
    min-sales: 3
    weight: 0.7

# ---------------------------------------------------------------------------
# Sale rumours - word reaching a seller out in the world
# ---------------------------------------------------------------------------
# Says that something sold, never what or for how much: counting it is the
# Ledger Keeper's job, in person. Collapsed to one message per cooldown however
# much sells, since the message carries no numbers to lose.
notifications:
  enabled: true
  cooldown-seconds: 300

entrance:
  craftable: true
  door-material: CRIMSON_DOOR
  # Whether ANYONE may mine a registered entrance door. Off by default, which still
  # lets the door's owner and anyone trusted in its land break it — that is how an
  # entrance gets moved. The hub entrance is always admin-only regardless.
  allow-break: false
  # Hand the crafted door item back when an entrance is broken, so relocating one
  # doesn't cost a fresh set of echo shards.
  refund-on-break: true
  # Re-check land trust each time someone uses a door, not just when placing it.
  # Off by default: owners walk guests in through their own entrance.
  require-trust-to-enter: false
  validation-interval-minutes: 30
  # The staged descent: how long between stepping through a door and landing on
  # the other side, and how long the dark lingers after arrival. Set both to 0
  # for an instant teleport.
  descent-ticks: 30
  fade-ticks: 40
  # Set with /wiicmarket entrance exit-here (block coordinates in the market world)
  exit-door: [ ]
  item:
    material: CRIMSON_DOOR
    name: "<dark_purple>sᴇᴄʀᴇᴛ ᴇɴᴛʀᴀɴᴄᴇ"
    lore:
      - "<gray>A door that remembers a place"
      - "<gray>no map has ever shown."
      - ""
      - "<dark_gray>Place inside your land — one per land."
  recipe:
    shape:
      - "OEO"
      - "EDE"
      - "OEO"
    ingredients:
      O: OBSIDIAN
      E: ECHO_SHARD
      D: DARK_OAK_DOOR

# ---------------------------------------------------------------------------
# Containment — the door is the only way in, and the only way out
# ---------------------------------------------------------------------------
# The market only means anything if getting there means something. On a server
# with homes, warps, pearls, blinks and party teleports there are dozens of ways
# to skip the door, so this works the other way round: every teleport crossing
# the market's threshold is refused unless WIIC itself arranged it, and anyone
# who ends up outside the envelope below is put back.
#
# Admin setup, inside the market world:
#   /wiicmarket plot wand      -> click two opposite corners of the whole market
#   /wiicmarket bounds set     -> writes the envelope below
#   /wiicmarket bounds show    -> where it is, and whether you are inside it
#
# Draw it generously — a few blocks of slack past the outermost wall costs
# nothing, while a box drawn tight will shove players about in doorways. Leave
# it undefined and only the void floor is enforced. The arrival point MUST be
# inside it, or every visitor is bounced straight back out.
#
# wiic.market.bypass (implied by wiic.market.admin) passes through all of this.
# Beyonder abilities inside the market (requires CircleOfImagination; ignored when
# it isn't installed). Kept out of `containment` on purpose: an ability is not a way
# out of the market, it is a way to damage or dismantle what is in it, so this stays
# in force even on a server that has switched teleport containment off.
abilities:
  blocked: true

containment:
  enabled: true
  bounds:
    min: [ ]                    # set by /wiicmarket bounds set
    max: [ ]
  patrol-interval-ticks: 40     # sweep for anyone outside the envelope (2s)
  message-cooldown-ms: 2500     # so a looping ability can't spam chat
  # Teleport causes still allowed *within* the market. Everything else — pearls,
  # blinks, plugin teleports, spectate, gateways — is refused inside as well as
  # across the threshold. The two defaults are vanilla mechanics that move a
  # player half a block and would strand them if blocked.
  allow-internal-causes:
    - DISMOUNT
    - EXIT_BED
  # Stopped at the throw and the bite rather than at the teleport, so the market
  # doesn't quietly eat the item before refusing the trip.
  block-ender-pearls: true
  block-chorus-fruit: true
  block-elytra: true            # no flying out over the walls
  block-vehicles: true          # boats/minecarts/mounts move by rules of their own

# ---------------------------------------------------------------------------
# Prestige plots — rentable storefronts inside the market world
# ---------------------------------------------------------------------------
# Admin flow, all inside the market world:
#   /wiicmarket plot wand              -> click the two corners of the stall
#   /wiicmarket plot define <id>       -> writes min/max below + stores the
#                                         pristine block snapshot for evictions
#   /wiicmarket plot vendorspot <id>   -> where the stall's vendor NPC stands
#   /wiicmarket plot list|snapshot|evict
# Renters get build + container rights inside their own cuboid; on eviction the
# stall's containers go to their market stash and the blocks are restored.
plots:
  enabled: true
  rent-price: 20480             # coppets per period; money sink like listing fees
  period-days: 7
  grace-hours: 48               # unpaid rent is tolerated this long before eviction
  max-per-player: 1
  upkeep-check-minutes: 30
  max-volume: 20000             # block cap per plot; snapshot/eviction walk the cuboid

  # -------------------------------------------------------------------------
  # Stall counters — a sign on a chest, the plot's own way to trade
  # -------------------------------------------------------------------------
  # The renter puts a sign on a chest inside their own stall:
  #
  #     [Market]        <- the tag below
  #     500             <- price, in coppets (or shorthand: 3v 12l 5c)
  #     1               <- items handed over per purchase (optional, default 1)
  #
  # then right-clicks the finished sign holding the goods to stock it. The sign
  # redraws itself with the item, the price and the owner's name. Customers click
  # it twice: once to be quoted, once to pay — money never leaves a wallet because
  # somebody brushed past the scenery.
  #
  # Stock is the chest's real contents, not a number in the database, so restocking
  # is just putting more in. Proceeds follow the broker's path: sale-tax to the
  # sink, the rest into the owner's ledger to claim at the Ledger Keeper.
  #
  # Owner controls, on their own counter:
  #   right-click holding goods -> stock / restock the sign
  #   right-click empty-handed  -> what it sells, what's in the chest, what it sold
  #   sneak + right-click       -> close the counter (leaves the sign standing)
  #   break the sign or chest   -> retire it
  shops:
    enabled: true
    sign-tag: "[Market]"
    max-per-plot: 12
    confirm-seconds: 6
    # Rendered onto both faces. Placeholders: %item% %price% %amount% %owner%
    sign-lines:
      - "<dark_purple>сᴛɪйᴋᴀ"
      - "<black>%item%"
      - "<dark_green>%price%"
      - "<dark_gray>%owner%"

  regions: { }                  # filled in by /wiicmarket plot define

# ---------------------------------------------------------------------------
# Courier deliveries (needs the UndeadPostmans plugin)
# ---------------------------------------------------------------------------
# A player leaves a summoning horn at the Courier Post NPC and every purchase is
# then flown to them by a postman at their own courier tier instead of waiting in
# the stash. Taking the horn back switches it off. Without UndeadPostmans the
# Courier Post politely refuses and everything falls back to the stash.
courier:
  enabled: true
  delivery-fee: 0               # optional coppet sink per delivery; the horn is the price

# ---------------------------------------------------------------------------
# Sound cues — "<sound id>:<volume>:<pitch>", volume and pitch optional.
# Sounds are addressed by vanilla string id, so a resource pack's own sounds
# work here too ("mypack:market.chime:0.8:1.0"). Set a key to "" to silence it.
# ---------------------------------------------------------------------------
sounds:
  entrance-open: "block.iron_door.open:0.7:0.5"     # heard at the door, by everyone
  entrance-forged: "block.respawn_anchor.set_spawn:0.8:0.6"
  descend: "ambient.cave:0.9:0.5"                   # the dark closing in
  arrive: "block.sculk_catalyst.bloom:0.7:0.6"
  depart: "block.iron_door.close:0.7:0.7"
  surface: "block.beacon.deactivate:0.5:1.4"
  rumour: "block.amethyst_block.hit:0.4:0.7"        # word that something sold
  listed: "block.vault.insert_item:0.8:1.0"
  purchase: "block.amethyst_block.chime:0.8:1.2"
  refused: "block.note_block.didgeridoo:0.6:0.6"
  coins: "block.amethyst_block.resonate:0.8:1.4"
  stash: "block.barrel.open:0.7:1.1"
  horn: "item.goat_horn.sound.0:0.5:1.0"


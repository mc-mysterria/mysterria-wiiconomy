# ---------------------------------------------------------------------------
# CircleOfImagination ingredient -> sequence index
# ---------------------------------------------------------------------------
# Beyonder ingredients carry only `circleofimagination:ingredient` in their PDC -
# no pathway, no sequence. Their worth comes from the formula they feed: an
# ingredient for a Sequence 2 potion is a different order of thing from one for a
# Sequence 9 potion. This file records, for every ingredient CoI defines, the
# DEEPEST (lowest-numbered, most powerful) sequence whose formula consumes it.
#
# `main` ingredients are the rare, defining components of a formula;
# `supplementary` ones are the filler. The Fence values them differently
# (see `valuation.coi.ingredient-*` in market.yml). An ingredient that is a main
# component of ANY formula is listed under `main`, even where another formula
# uses it as filler - being the defining half of a formula is what makes it rare.
#
# Regenerate after CoI adds pathways or sequences. Ingredients missing from this
# file are valued at `valuation.coi.unknown-ingredient-sequence` and logged once,
# so a gap shows up in the console rather than silently mispricing goods.
#
# Generated from CircleOfImagination pathway sources (origin/development), covering
# sequences 1-9 across 32 pathways.

